<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山奥Transfer</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#34c759">

  <!-- 【変更】長文に強い QRious に変更 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 0 auto; padding: 16px; background: #1c1c1e; color: #f2f2f7; line-height: 1.5; }
    .card { background: #2c2c2e; padding: 20px; border-radius: 16px; margin-bottom: 16px; text-align: center; }
    button { background: #34c759; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    button:disabled { background: #48484a; color: #8e8e93; }
    .btn-secondary { background: #007aff; }
    .btn-outline { background: transparent; border: 2px solid #48484a; color: #aeaeb2; margin-top: 16px; }
    .btn-small { padding: 8px 12px; font-size: 14px; width: auto; margin: 0; background: #48484a; }
    .step-badge { background: #30d158; color: #000; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 8px; }
    .qr-container { display: flex; justify-content: center; margin: 16px 0; background: white; padding: 16px; border-radius: 12px; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 16px; background: #000; }
    input[type="file"] { margin: 16px 0; width: 100%; border: none; background: transparent; }
    progress { width: 100%; height: 12px; margin-top: 12px; border-radius: 6px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin: 0 0 8px 0;">⛰️ 山奥Transfer</h2>
    <p id="status" style="color: #30d158; font-weight: bold; margin: 0;">完全オフラインモード待機中</p>
  </div>

  <!-- 【自己増殖】事前準備ゼロの相手へ送る（Dropper方式） -->
  <div class="card" id="dropper-card">
    <span class="step-badge" style="background:#ff3b30; color:white;">事前準備ゼロの相手へ</span>
    <h3 style="margin-top:0;">起動用アプリを渡す</h3>
    <p style="font-size: 12px; color: #aeaeb2; text-align: left;">
      相手のiPhoneカメラで読ませてテキストコピー ➔ メモ帳にペースト ➔ ファイル保存 ➔ 拡張子を「.html」に変更して開かせてください。
    </p>
    <button id="showDropperBtn" class="btn-secondary">1. 起動用アプリのQRを表示</button>
    
    <div id="dropper-qrcode" class="qr-container hidden"></div>
    
    <button id="preparePayloadBtn" class="btn-outline hidden">2. 本体データ(分割QR)の準備</button>
    
    <div id="payload-section" class="hidden">
      <p id="payload-status" style="font-weight:bold; margin-top:16px;"></p>
      <div id="payload-qrcode" class="qr-container"></div>
      <div style="display:flex; justify-content:space-between; margin-top:8px;">
        <button id="prevQrBtn" class="btn-small" style="width:48%">← 前のQR</button>
        <button id="nextQrBtn" class="btn-small" style="width:48%">次のQR →</button>
      </div>
    </div>
  </div>

  <hr style="border-color: #48484a; margin: 24px 0;">

  <!-- 通常のP2P接続セットアップエリア -->
  <div class="card" id="setup-card">
    <span class="step-badge" id="step-num">STEP 1</span>
    <h3 id="step-title" style="margin-top:0;">P2P接続（相手もアプリがある場合）</h3>
    
    <button id="actionBtn">1. Offer (接続要求) を生成</button>
    <div id="qrcode" class="qr-container hidden"></div>
    <div id="reader" class="hidden"></div>
    <button id="switchChildBtn" class="btn-outline">（子機の場合）親機のQRを読み取る</button>
  </div>

  <!-- ファイル転送エリア -->
  <div class="card hidden" id="transfer-card">
    <h3>📁 ファイル送信</h3>
    <input type="file" id="fileInput" />
    <button id="sendBtn">選択したファイルを送信</button>
    <progress id="progressBar" value="0" max="100" class="hidden"></progress>
  </div>

  <script>
    // QRコード生成の共通関数（Qriousを使用）
    function generateQR(containerId, textData) {
      const container = document.getElementById(containerId);
      container.innerHTML = '<canvas></canvas>'; // 古いQRを消す
      container.classList.remove('hidden');
      new QRious({
        element: container.querySelector('canvas'),
        value: textData,
        size: 280, // サイズを少し大きくして読みやすく
        level: 'L'
      });
    }

    // --- 超軽量・ターミナル風 Dropper (約380文字) ---
    const dropperHtml = `<textarea id=t style="width:100%;height:99vh;background:#000;color:#0f0;font-size:18px" oninput="try{j=JSON.parse(value);p[j.i]=j.d;value=Object.keys(p).length+'/'+j.t+' 受信済';if(Object.keys(p).length==j.t)document.write('<a download=app.html href='+URL.createObjectURL(new Blob([Object.values(p).join('')],{type:'text/html'}))+' style=display:block;margin:20vh;font-size:30px>▶ 保存して開く</a>')}catch(e){}"></textarea><script>p={}<\/script>`;

    let payloadChunks = [];
    let currentChunkIndex = 0;

    document.getElementById('showDropperBtn').onclick = () => {
      try {
        generateQR('dropper-qrcode', dropperHtml);
        document.getElementById('preparePayloadBtn').classList.remove('hidden');
      } catch (e) {
        alert("QRの描画に失敗しました: " + e.message);
      }
    };

    document.getElementById('preparePayloadBtn').onclick = async () => {
      try {
        const res = await fetch(location.href);
        const text = await res.text();
        
        // 分割サイズ（約800文字）
        const CHUNK_SIZE = 800;
        payloadChunks = [];
        const total = Math.ceil(text.length / CHUNK_SIZE);
        
        for(let i = 0; i < total; i++) {
          let chunk = text.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          payloadChunks.push(JSON.stringify({ i: i + 1, t: total, d: chunk }));
        }

        document.getElementById('payload-section').classList.remove('hidden');
        document.getElementById('preparePayloadBtn').classList.add('hidden');
        showPayloadQr(0);
      } catch (e) {
        alert("本体データの取得に失敗しました。");
      }
    };

    function showPayloadQr(index) {
      document.getElementById('payload-status').innerText = `本体データ: ${index + 1} / ${payloadChunks.length}`;
      generateQR('payload-qrcode', payloadChunks[index]);
    }

    document.getElementById('prevQrBtn').onclick = () => {
      if(currentChunkIndex > 0) {
        currentChunkIndex--;
        showPayloadQr(currentChunkIndex);
      }
    };
    document.getElementById('nextQrBtn').onclick = () => {
      if(currentChunkIndex < payloadChunks.length - 1) {
        currentChunkIndex++;
        showPayloadQr(currentChunkIndex);
      }
    };

    // --- WebRTC セットアップ ---
    const rtcConfig = { iceServers: [] };
    let pc = new RTCPeerConnection(rtcConfig);
    let dc = null;
    let html5QrcodeScanner = null;
    const CHUNK_SIZE_RTC = 16384;

    const statusEl = document.getElementById('status');
    const actionBtn = document.getElementById('actionBtn');
    const switchChildBtn = document.getElementById('switchChildBtn');
    const readerDiv = document.getElementById('reader');

    const compressSDP = (sdp) => btoa(JSON.stringify(sdp));
    const decompressSDP = (str) => JSON.parse(atob(str));

    function startScanner(onScanSuccess) {
      readerDiv.classList.remove('hidden');
      document.getElementById('qrcode').classList.add('hidden');
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render((decodedText) => {
        html5QrcodeScanner.clear();
        readerDiv.classList.add('hidden');
        onScanSuccess(decodedText);
      });
    }

    function bindEvents(channel) {
      dc = channel;
      dc.binaryType = 'arraybuffer';
      dc.onopen = () => {
        statusEl.innerText = "✅ P2P接続完了！";
        document.getElementById('setup-card').classList.add('hidden');
        document.getElementById('dropper-card').classList.add('hidden');
        document.getElementById('transfer-card').classList.remove('hidden');
      };

      let buffers = [];
      let meta = null;
      dc.onmessage = (e) => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'header') {
            meta = msg;
            buffers = [];
            statusEl.innerText = `受信中: ${msg.name}`;
          } else if (msg.type === 'EOF') {
            const blob = new Blob(buffers);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = meta.name;
            a.click();
            statusEl.innerText = "✅ 受信完了！";
          }
        } else {
          buffers.push(e.data);
        }
      };
    }

    let state = 'INIT';
    actionBtn.onclick = async () => {
      if (state === 'INIT') {
        dc = pc.createDataChannel('fileTransfer');
        bindEvents(dc);
        switchChildBtn.classList.add('hidden');
        document.getElementById('dropper-card').classList.add('hidden');

        pc.onicecandidate = (e) => {
          if (!e.candidate) {
            generateQR('qrcode', compressSDP(pc.localDescription));
            actionBtn.innerText = "2. 相手の応答をスキャン";
            state = 'WAIT_ANSWER';
          }
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

      } else if (state === 'WAIT_ANSWER') {
        startScanner(async (scannedData) => {
          const answer = decompressSDP(scannedData);
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
          statusEl.innerText = "リンク確立中...";
        });

      } else if (state === 'IS_CHILD') {
        document.getElementById('dropper-card').classList.add('hidden');
        startScanner(async (scannedData) => {
          pc.ondatachannel = (e) => bindEvents(e.channel);
          pc.onicecandidate = (e) => {
            if (!e.candidate) {
              generateQR('qrcode', compressSDP(pc.localDescription));
              actionBtn.classList.add('hidden');
            }
          };
          const offer = decompressSDP(scannedData);
          await pc.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
        });
      }
    };

    switchChildBtn.onclick = () => {
      state = 'IS_CHILD';
      actionBtn.innerText = "カメラでスキャン";
      switchChildBtn.classList.add('hidden');
    };

    document.getElementById('sendBtn').onclick = () => {
      const file = document.getElementById('fileInput').files[0];
      if (!file || !dc || dc.readyState !== 'open') return;
      
      dc.send(JSON.stringify({ type: 'header', name: file.name, size: file.size }));
      const reader = new FileReader();
      let offset = 0;
      const progress = document.getElementById('progressBar');
      progress.classList.remove('hidden');

      reader.onload = (e) => {
        dc.send(e.target.result);
        offset += e.target.result.byteLength;
        progress.value = (offset / file.size) * 100;
        
        if (offset < file.size) {
          readSlice();
        } else {
          dc.send(JSON.stringify({ type: 'EOF' }));
          statusEl.innerText = "✅ 送信完了！";
          setTimeout(() => { progress.classList.add('hidden'); progress.value = 0; }, 2000);
        }
      };
      const readSlice = () => reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK_SIZE_RTC));
      readSlice();
    };

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
