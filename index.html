<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山奥Transfer</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#34c759">

  <!-- ライブラリの読み込み（SWによりオフラインキャッシュされます） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 0 auto; padding: 16px; background: #1c1c1e; color: #f2f2f7; }
    .card { background: #2c2c2e; padding: 20px; border-radius: 16px; margin-bottom: 16px; text-align: center; }
    button { background: #34c759; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    button:disabled { background: #48484a; color: #8e8e93; cursor: not-allowed; }
    .btn-secondary { background: #007aff; }
    .btn-outline { background: transparent; border: 2px solid #48484a; color: #aeaeb2; margin-top: 16px; }
    .step-badge { background: #30d158; color: #000; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 8px; }
    #qrcode { display: flex; justify-content: center; margin: 16px 0; background: white; padding: 16px; border-radius: 12px; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 16px; background: #000; }
    input[type="file"] { margin: 16px 0; width: 100%; color: #f2f2f7; }
    progress { width: 100%; height: 12px; margin-top: 12px; border-radius: 6px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⛰️ 山奥Transfer</h2>
    <p id="status" style="color: #30d158; font-weight: bold;">完全オフラインモード待機中</p>
  </div>

  <!-- 接続セットアップエリア -->
  <div class="card" id="setup-card">
    <span class="step-badge" id="step-num">STEP 1</span>
    <h3 id="step-title">親機（あなた）のQRを生成</h3>
    <p id="step-desc" style="font-size: 14px; color: #aeaeb2;">「Offerを生成」を押し、相手に読み取らせてください。</p>
    
    <button id="actionBtn">1. Offer (接続要求) を生成</button>
    
    <div id="qrcode" class="hidden"></div>
    <div id="reader" class="hidden"></div>

    <button id="switchChildBtn" class="btn-outline">（子機の場合）親機のQRを読み取る</button>
  </div>

  <!-- ファイル転送エリア -->
  <div class="card hidden" id="transfer-card">
    <h3>📁 ファイル送信</h3>
    <input type="file" id="fileInput" />
    <button id="sendBtn">選択したファイルを送信</button>
    <progress id="progressBar" value="0" max="100" class="hidden"></progress>
    
    <hr style="border-color: #48484a; margin: 24px 0;">
    
    <h3>🎁 アプリ本体の受け渡し</h3>
    <p style="font-size: 12px; color: #aeaeb2; margin-bottom: 12px;">相手がこのアプリを持っていない場合、アプリ本体（HTML）を直接送信して相手にインストールさせることができます。</p>
    <button id="shareAppBtn" class="btn-secondary">このアプリ自体を相手に送る</button>
  </div>

  <script>
    // --- WebRTC セットアップ (STUNなしの完全ローカル) ---
    const rtcConfig = { iceServers: [] };
    let pc = new RTCPeerConnection(rtcConfig);
    let dc = null;
    let html5QrcodeScanner = null;
    const CHUNK_SIZE = 16384;

    const statusEl = document.getElementById('status');
    const stepNum = document.getElementById('step-num');
    const stepTitle = document.getElementById('step-title');
    const stepDesc = document.getElementById('step-desc');
    const actionBtn = document.getElementById('actionBtn');
    const switchChildBtn = document.getElementById('switchChildBtn');
    const qrDiv = document.getElementById('qrcode');
    const readerDiv = document.getElementById('reader');
    const setupCard = document.getElementById('setup-card');
    const transferCard = document.getElementById('transfer-card');

    // SDPの圧縮・展開（QRコード容量削減）
    const compressSDP = (sdp) => btoa(JSON.stringify(sdp));
    const decompressSDP = (str) => JSON.parse(atob(str));

    // QR表示
    function showQR(data) {
      qrDiv.innerHTML = '';
      qrDiv.classList.remove('hidden');
      new QRCode(qrDiv, { text: data, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L });
    }

    // カメラ起動
    function startScanner(onScanSuccess) {
      readerDiv.classList.remove('hidden');
      qrDiv.classList.add('hidden');
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render((decodedText) => {
        html5QrcodeScanner.clear();
        readerDiv.classList.add('hidden');
        onScanSuccess(decodedText);
      });
    }

    // DataChannel イベントバインド（受信処理）
    function bindEvents(channel) {
      dc = channel;
      dc.binaryType = 'arraybuffer';
      dc.onopen = () => {
        statusEl.innerText = "✅ P2P接続完了！(ギガ消費ゼロ)";
        setupCard.classList.add('hidden');
        transferCard.classList.remove('hidden');
      };

      let buffers = [];
      let meta = null;
      dc.onmessage = (e) => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'header') {
            meta = msg;
            buffers = [];
            statusEl.innerText = `受信中: ${msg.name}`;
          } else if (msg.type === 'EOF') {
            const blob = new Blob(buffers);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = meta.name;
            a.click();
            statusEl.innerText = "✅ ファイル受信完了！";
          }
        } else {
          buffers.push(e.data);
        }
      };
    }

    // --- シグナリング（QR相互スキャン）状態管理 ---
    let state = 'INIT';

    actionBtn.onclick = async () => {
      if (state === 'INIT') {
        // 親機：Offer生成
        dc = pc.createDataChannel('fileTransfer');
        bindEvents(dc);
        switchChildBtn.classList.add('hidden');

        pc.onicecandidate = (e) => {
          if (!e.candidate) { // 経路収集完了
            showQR(compressSDP(pc.localDescription));
            stepNum.innerText = "STEP 2";
            stepTitle.innerText = "相手にこのQRを読ませる";
            stepDesc.innerText = "相手が読み取ったら『相手の応答をスキャン』を押してください。";
            actionBtn.innerText = "2. 相手の応答(Answer)をスキャン";
            state = 'WAIT_ANSWER';
          }
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

      } else if (state === 'WAIT_ANSWER') {
        // 親機：Answerスキャン
        startScanner(async (scannedData) => {
          const answer = decompressSDP(scannedData);
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
          statusEl.innerText = "P2Pリンク確立中...";
        });

      } else if (state === 'IS_CHILD') {
        // 子機：Offerスキャン
        startScanner(async (scannedData) => {
          pc.ondatachannel = (e) => bindEvents(e.channel);
          
          pc.onicecandidate = (e) => {
            if (!e.candidate) {
              showQR(compressSDP(pc.localDescription));
              stepNum.innerText = "STEP 3";
              stepTitle.innerText = "親機にこのQRを見せる";
              stepDesc.innerText = "親機が読み取ると自動で接続が完了します。";
              actionBtn.classList.add('hidden');
            }
          };

          const offer = decompressSDP(scannedData);
          await pc.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
        });
      }
    };

    switchChildBtn.onclick = () => {
      state = 'IS_CHILD';
      stepNum.innerText = "STEP 1 (子機)";
      stepTitle.innerText = "親機のQRコードを読み取る";
      stepDesc.innerText = "親機の画面に表示されたQRコードをスキャンしてください。";
      actionBtn.innerText = "カメラを起動してスキャン";
      switchChildBtn.classList.add('hidden');
    };

    // --- ファイル送信共通ロジック ---
    function sendFile(file) {
      if (!dc || dc.readyState !== 'open') return;
      
      dc.send(JSON.stringify({ type: 'header', name: file.name, size: file.size }));
      const reader = new FileReader();
      let offset = 0;
      const progress = document.getElementById('progressBar');
      progress.classList.remove('hidden');

      reader.onload = (e) => {
        dc.send(e.target.result);
        offset += e.target.result.byteLength;
        progress.value = (offset / file.size) * 100;
        
        if (offset < file.size) {
          readSlice();
        } else {
          dc.send(JSON.stringify({ type: 'EOF' }));
          statusEl.innerText = "✅ 送信完了！";
          setTimeout(() => { progress.classList.add('hidden'); progress.value = 0; }, 2000);
        }
      };
      
      const readSlice = () => {
        const slice = file.slice(offset, offset + CHUNK_SIZE);
        reader.readAsArrayBuffer(slice);
      };
      readSlice();
    }

    // ユーザーファイル送信
    document.getElementById('sendBtn').onclick = () => {
      const file = document.getElementById('fileInput').files[0];
      if (file) sendFile(file);
    };

    // アプリ自体（HTML）を相手に送信
    document.getElementById('shareAppBtn').onclick = async () => {
      try {
        statusEl.innerText = "アプリ本体を準備中...";
        const response = await fetch(location.href);
        const htmlContent = await response.text();
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const file = new File([blob], "yamaoku-transfer.html", { type: 'text/html' });
        
        sendFile(file);
        alert('アプリ本体（HTML）を送信しました。相手の端末で保存して開いてもらってください。');
      } catch (err) {
        alert('アプリの取得に失敗しました。');
      }
    };

    // --- Service Worker 登録 ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW registered!', reg.scope))
          .catch((err) => console.error('SW failed!', err));
      });
    }
  </script>
</body>
</html>
